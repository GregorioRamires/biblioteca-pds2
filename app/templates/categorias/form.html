{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form class="formulario" method="post">
  <label for="nome">Nome *</label>
  <input id="nome" name="nome" value="{{ categoria.nome }}" maxlength="60" required autofocus>

  <label for="descricao">Descrição</label>
  <textarea id="descricao" name="descricao" rows="3">{{ categoria.descricao or '' }}</textarea>

  <div class="botoes">
    <button class="botao">Salvar</button>
    <a class="botao botao-secundario" href="{{ url_for('categorias.listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
