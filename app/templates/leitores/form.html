{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form class="formulario" method="post">
  <label for="nome">Nome completo *</label>
  <input id="nome" name="nome" value="{{ leitor.nome }}" required autofocus>

  <div class="linha">
    <div>
      <label for="email">E-mail *</label>
      <input id="email" name="email" type="email" value="{{ leitor.email }}" required>
    </div>
    <div>
      <label for="telefone">Telefone (com DDD)</label>
      <input id="telefone" name="telefone" value="{{ leitor.telefone or '' }}" placeholder="(43) 99999-0000">
    </div>
  </div>

  <div class="botoes">
    <button class="botao">Salvar</button>
    <a class="botao botao-secundario" href="{{ url_for('leitores.listar') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
